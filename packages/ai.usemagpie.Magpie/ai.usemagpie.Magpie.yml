id: ai.usemagpie.Magpie
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: magpie
finish-args:
  # the gateway listens on 127.0.0.1:3425 for the agents on this machine
  - --share=network
  # Wails shell (GTK 3 + WebKitGTK 4.1)
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # the agents magpie configures live in the home directory (~/.claude, ~/.codex,
  # ~/.gemini …); magpie's own files stay under $XDG_CONFIG_HOME and $XDG_CACHE_HOME
  - --filesystem=home
  # host tools for the agents
  - --filesystem=host-os
  - --filesystem=/opt:ro

  - --talk-name=org.a11y.Bus
  - --own-name=org.kde.*
  - --own-name=ai.usemagpie.app.*

  # no daily usage report
  - --env=DO_NOT_TRACK=1
  - --env=GTK3_MODULES=/app/lib/gtk-3.0/modules/libmagpie-theme-follow.so
modules:
  - name: magpie-theme-follow
    buildsystem: simple
    build-commands:
      - mkdir -p ${FLATPAK_DEST}/lib/gtk-3.0/modules
      - gcc -shared -fPIC -O2 -o ${FLATPAK_DEST}/lib/gtk-3.0/modules/libmagpie-theme-follow.so
        theme-follow-module.c $(pkg-config --cflags --libs gtk+-3.0 gio-2.0)
    sources:
      - type: file
        path: theme-follow-module.c

  - name: magpie
    buildsystem: simple
    build-commands:
      - install -Dm755 magpie ${FLATPAK_DEST}/lib/magpie/magpie
      - install -Dm755 magpie-wrapper ${FLATPAK_DEST}/bin/magpie
      - install -Dm644 ai.usemagpie.Magpie.desktop ${FLATPAK_DEST}/share/applications/ai.usemagpie.Magpie.desktop
      - install -Dm644 ai.usemagpie.Magpie.metainfo.xml ${FLATPAK_DEST}/share/metainfo/ai.usemagpie.Magpie.metainfo.xml
      - install -Dm644 ai.usemagpie.Magpie.png ${FLATPAK_DEST}/share/icons/hicolor/256x256/apps/ai.usemagpie.Magpie.png
    sources:
      - type: file
        url: https://github.com/yetone/magpie-releases/releases/download/v0.1.2795/magpie-linux-amd64
        dest-filename: magpie
        sha256: d6ed89658de6d22235f8ae9d4234853f3a31f965fb3064e9eade5a9ac43ba502
        only-arches:
          - x86_64
        x-checker-data:
          type: json
          url: https://api.github.com/repos/yetone/magpie-releases/releases/latest
          version-query: .tag_name | ltrimstr("v")
          url-query: .assets[] | select(.name == "magpie-linux-amd64") | .browser_download_url
      - type: file
        url: https://github.com/yetone/magpie-releases/releases/download/v0.1.2795/magpie-linux-arm64
        dest-filename: magpie
        sha256: 26f1882a5b3ab9ae7347853bcac8615ca29918663a77f62ac22a8804ab2b640d
        only-arches:
          - aarch64
        x-checker-data:
          type: json
          url: https://api.github.com/repos/yetone/magpie-releases/releases/latest
          version-query: .tag_name | ltrimstr("v")
          url-query: .assets[] | select(.name == "magpie-linux-arm64") | .browser_download_url
      - type: script
        dest-filename: magpie-wrapper
        commands:
          - export PATH="${PATH:+$PATH:}/run/host/usr/local/sbin:/run/host/usr/local/bin:/run/host/usr/sbin:/run/host/usr/bin:/run/host/sbin:/run/host/bin"
          - exec /app/lib/magpie/magpie "$@"
      - type: file
        url: https://usemagpie.ai/img/icon-256.png
        dest-filename: ai.usemagpie.Magpie.png
        sha256: 57437c6596e05a8fcfc42d4288c030aa00ed86b69fe35d464d69d7026150c704
      - type: file
        path: ai.usemagpie.Magpie.desktop
      - type: file
        path: ai.usemagpie.Magpie.metainfo.xml
