id: com.sipeed.MaixVision
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: maixvision
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --filesystem=/run/media
  - --filesystem=/mnt
  - --device=all
  - --share=network
modules:
  - name: maixvision
    buildsystem: simple
    build-commands:
      # Extract AppImage
      - chmod a+x MaixVision.AppImage
      - ./MaixVision.AppImage --appimage-extract
      # Copy contents
      - install -Dm644 com.sipeed.MaixVision.desktop ${FLATPAK_DEST}/share/applications/com.sipeed.MaixVision.desktop
      - install -Dm644 com.sipeed.MaixVision.metainfo.xml ${FLATPAK_DEST}/share/metainfo/com.sipeed.MaixVision.metainfo.xml
      - install -Dm644 squashfs-root/maixvision.png ${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/com.sipeed.MaixVision.png
      - mkdir -p ${FLATPAK_DEST}/lib
      - cp -r squashfs-root -T ${FLATPAK_DEST}/lib/maixvision
      # Create wrapper script
      - ./create-maixvision-wrapper
      - install -Dm755 maixvision ${FLATPAK_DEST}/bin/maixvision
    sources:
      - type: file
        url: https://cdn.sipeed.com/maixvision/1.2.3/MaixVision-1.2.3-x86_64.AppImage
        sha256: 3b64c3b903e925f3d625c04b43b2c2f0886a1d1692e811ef7cb76dc597f8de0c
        dest-filename: MaixVision.AppImage
        only-arches: [x86_64]
        x-checker-data:
          type: json
          url: https://cdn.sipeed.com/maixvision/latest-linux.json
          version-query: .version
          url-query: .version as $v | .files[] | select(.url | test("x86_64\\.AppImage$"))
            | "https://cdn.sipeed.com/maixvision/\($v)/\(.url)"
      - type: file
        url: https://cdn.sipeed.com/maixvision/1.2.3/MaixVision-1.2.3-arm64.AppImage
        sha256: 3fdea57fd5ca54b6ee713e88cc6817465c0e5b0191b4ef27ffc056d37ebb1531
        dest-filename: MaixVision.AppImage
        only-arches: [aarch64]
        x-checker-data:
          type: json
          url: https://cdn.sipeed.com/maixvision/latest-linux.json
          version-query: .version
          url-query: .version as $v | .files[] | select(.url | test("arm64\\.AppImage$"))
            | "https://cdn.sipeed.com/maixvision/\($v)/\(.url)"
      - type: file
        path: com.sipeed.MaixVision.desktop
      - type: file
        path: com.sipeed.MaixVision.metainfo.xml
      - type: script
        dest-filename: create-maixvision-wrapper
        commands:
          - cat > maixvision <<EOF
          - '  export APPDIR=${FLATPAK_DEST}/lib/maixvision'
          - '  if test \$WAYLAND_DISPLAY'
          - '  then'
          - '    flags="--ozone-platform=wayland \$flags"'
          - '  fi'
          - '  exec zypak-wrapper ${FLATPAK_DEST}/lib/maixvision/AppRun \$flags \$@'
          - EOF
  - name: maixpy
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=${FLATPAK_DEST} *.whl
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/ec/b3/416a4cb9891a99f0cf11cc9e34afd1cf460a4412bc4c0480051d940be3ac/maixpy-4.12.5-cp313-cp313-manylinux2014_x86_64.whl
        sha256: e8a33ce50d8fceaa83a9338687bf178272bcabcbb363ff4d7dd56d9e9e616e14
        x-checker-data:
          type: json
          url: https://pypi.org/pypi/maixpy/json
          version-query: .info.version
          url-query: .urls[] | select(.python_version == "cp313" and .packagetype
            == "bdist_wheel") | .url
          timestamp-query: .urls[] | select(.python_version == "cp313" and .packagetype
            == "bdist_wheel") | .upload_time_iso_8601
